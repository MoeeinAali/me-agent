name: me-agent

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: me_agent
      POSTGRES_PASSWORD: me_agent
      POSTGRES_DB: me_agent
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U me_agent -d me_agent"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  db-data:
