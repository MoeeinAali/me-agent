name: me-agent

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: me_agent
      POSTGRES_PASSWORD: me_agent
      POSTGRES_DB: me_agent
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U me_agent -d me_agent"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim-bookworm}
    image: me-agent-api:local
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://me_agent:me_agent@db:5432/me_agent
      CORS_ORIGINS: '["http://localhost:3000"]'
      DATA_DIR: /app/data
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: frontend
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24-alpine}
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    image: me-agent-web:local
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  db-data:
